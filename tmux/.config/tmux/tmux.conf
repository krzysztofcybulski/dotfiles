# ============================================================================
# tmux.conf — Tokyo Night, omerxx-style
# ============================================================================

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color + Kitty keyboard protocol (for Shift+Enter in Claude Code)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"
set -as terminal-features 'xterm*:extkeys'

# Faster repeat
set -sg escape-time 10
set -g repeat-time 800
set -g focus-events on

# Mouse
set -g mouse on

# Vi mode in copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Index from 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# History
set -g history-limit 100000

# Splits
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ============================================================================
# Plugins (TPM)
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'janoamaral/tokyo-night-tmux'

# sessionx
set -g @sessionx-bind 'o'
set -g @sessionx-window-mode 'on'

# floax
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#7aa2f7'
set -g @floax-text-color '#c0caf5'

# tokyo-night-tmux look
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format DMY
set -g @tokyo-night-tmux_time_format 24H

# Bootstrap TPM (auto-install on fresh machines)
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm \
   && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
