# Atuin — local-first shell history.
# Run `atuin register` later to enable cross-machine sync.

dialect = "uk"
auto_sync = false
update_check = false
sync_frequency = "1h"

# Search
search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
inline_height = 20
style = "compact"
show_preview = true
show_help = true
exit_mode = "return-original"
keymap_mode = "auto"

# Stats / history
history_filter = [
  "^secret-cmd",
  "^password",
]

[stats]
common_subcommands = [
  "git", "cargo", "go", "kubectl", "docker",
  "npm", "bun", "yarn", "pnpm",
]
